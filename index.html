<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eu Que Me Vejo</title>
<meta name="description" content="Diário entre sessões inspirado na Terapia de Aceitação e Compromisso (ACT). Socorro Silveira, Psicóloga Clínica.">
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#FAF7F1" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eu Que Me Vejo">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png?v=2" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" sizes="180x180">
<!-- Telas de abertura do iOS (aparecem ao abrir pela tela inicial) -->
<link rel="apple-touch-startup-image" href="splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Resolve o tema antes da primeira pintura, para não piscar.
  (function(){
    var pref = 'system';
    try { pref = (JSON.parse(localStorage.getItem('euqmv:v2')) || {}).theme || 'system'; } catch(e) {}
    var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app" id="app">
  <header class="topbar" id="topbar">
    <img class="topbar-logo logo-on-light" src="logo.png" alt="Socorro Silveira, Psicóloga Clínica" width="780" height="151">
    <img class="topbar-logo logo-on-dark" src="logo-light.png" alt="" aria-hidden="true" width="780" height="151">
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema claro ou escuro"></button>
  </header>

  <main id="main">
    <section class="view" id="view-home" aria-labelledby="homeTitle"></section>
    <section class="view" id="view-history" aria-labelledby="historyTitle" hidden></section>
    <section class="view" id="view-patterns" aria-labelledby="patternsTitle" hidden></section>
    <section class="view" id="view-about" aria-labelledby="aboutTitle" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
</div>

<!-- Registro passo a passo (tela cheia) -->
<div class="flow" id="flow" hidden role="dialog" aria-modal="true" aria-label="Novo registro"></div>

<!-- Boas-vindas (primeiro acesso) -->
<div class="onboarding" id="onboarding" hidden role="dialog" aria-modal="true" aria-labelledby="obTitle"></div>

<!-- Folha inferior: ajudas, exemplo, confirmações -->
<div class="sheet-overlay" id="sheetOverlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
